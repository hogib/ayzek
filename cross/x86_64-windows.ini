# Cross build for 64-bit Windows with zig, as the Raspberry Pi build uses zig for
# aarch64 (docs/impl/11-windows.md). Produces a static ayzek.exe that needs no
# runtime DLLs.
#
#   meson setup build-win --cross-file cross/x86_64-windows.ini --buildtype=release

[binaries]
c = '@DIRNAME@/zig-cc-windows'
cpp = '@DIRNAME@/zig-c++-windows'
ar = '@DIRNAME@/zig-ar-windows'
exe_wrapper = 'wine'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
cpp_args = ['-Wno-nullability-completeness']
