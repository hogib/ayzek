# Cross build for Raspberry Pi 4/5 (aarch64) with zig. Binaries are statically
# linked against musl and need no runtime libraries. Tests run under qemu-aarch64.
#
#   meson setup build-pi --cross-file cross/aarch64-pi.ini --buildtype=release
[constants]
cpu = 'cortex_a72'   # Pi 4; 'cortex_a76' for Pi 5 (zig CPU names use underscores)

[binaries]
c = '@DIRNAME@/zig-cc'
cpp = '@DIRNAME@/zig-c++'
ar = '@DIRNAME@/zig-ar'
exe_wrapper = 'qemu-aarch64'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a72'
endian = 'little'

[built-in options]
# libc++ headers trigger clang's -Wnullability-completeness, which -Werror would make fatal.
cpp_args = ['-mcpu=' + cpu, '-Wno-nullability-completeness']
