# Raspberry Pi 4/5 (aarch64), statically linked against musl, so the binary runs
# on any 64-bit Pi OS without installing anything. Tests run under qemu-aarch64.
#
#   meson setup build-pi --cross-file cross/aarch64-pi.ini --buildtype=release
[constants]
cpu = 'cortex_a72'   # Pi 4; 'cortex_a76' for a Pi 5. zig spells CPUs with underscores.

[binaries]
c = '@DIRNAME@/zig-cc'
cpp = '@DIRNAME@/zig-c++'
ar = '@DIRNAME@/zig-ar'
exe_wrapper = 'qemu-aarch64'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a72'
endian = 'little'

[built-in options]
# libc++ headers trip clang's nullability-completeness warning under -Werror.
cpp_args = ['-mcpu=' + cpu, '-Wno-nullability-completeness']
