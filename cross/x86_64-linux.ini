# Static x86-64 Linux build with zig, for a binary that runs on any distribution
# regardless of its glibc. A native build links against the host's libstdc++ and
# glibc (GLIBC_2.38 and GLIBCXX_3.4.36 on the machine this was written on),
# which is fine locally and fails to start on an older system.
#
#   meson setup build-linux --cross-file cross/x86_64-linux.ini --buildtype=release

[binaries]
c = '@DIRNAME@/zig-cc-linux'
cpp = '@DIRNAME@/zig-c++-linux'
ar = '@DIRNAME@/zig-ar-linux'

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
cpp_args = ['-Wno-nullability-completeness']
